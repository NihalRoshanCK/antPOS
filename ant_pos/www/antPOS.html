<!DOCTYPE html>
<html class="h-full" lang="en" data-theme-mode="{{ theme_mode or 'light' }}">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover maximum-scale=1.0, user-scalable=no"
    />
    <title>antPOS</title>
    <script>
      // Resolve the theme before first paint. The server writes the user's
      // choice into data-theme-mode; "automatic" follows the OS. Outside
      // Frappe (vite dev) the Jinja placeholder is left as-is, so fall back
      // to the last choice stored in this browser.
      (function () {
        var root = document.documentElement
        var mode = root.getAttribute('data-theme-mode') || ''
        if (!/^(light|dark|automatic)$/.test(mode)) {
          try { mode = localStorage.getItem('antpos-theme-mode') || 'light' } catch (e) { mode = 'light' }
          root.setAttribute('data-theme-mode', mode)
        }
        var dark = mode === 'dark' ||
          (mode === 'automatic' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="antPOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Static file from public/; the build prefixes it with the asset path. -->
    <link rel="manifest" href="/assets/ant_pos/antPOS/manifest.webmanifest" />

    <!-- PWA -->
    <link
      rel="icon"
      type="image/png"
      sizes="196x196"
      href="/assets/ant_pos/manifest/apple-icon-180.png"
    />
    <link
      rel="apple-touch-icon"
      href="/assets/ant_pos/manifest/apple-icon-180.png"
    />

    <script type="module" crossorigin src="/assets/ant_pos/antPOS/assets/index-BhPSLee4.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/ant_pos/antPOS/assets/vendor-vue-grwoQez2.js">
    <link rel="modulepreload" crossorigin href="/assets/ant_pos/antPOS/assets/vendor-d812nwJl.js">
    <link rel="stylesheet" crossorigin href="/assets/ant_pos/antPOS/assets/vendor-BqHVpbsC.css">
    <link rel="stylesheet" crossorigin href="/assets/ant_pos/antPOS/assets/index-X9SJroaY.css">
  </head>
  <body class="sm:overscroll-y-none no-scrollbar">
    <div id="app" class="h-full"></div>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
